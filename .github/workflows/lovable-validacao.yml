name: Validar capa Lovable

on:
  push:
    branches:
      - 'Capa-Interativa-(lovable)'
    paths:
      - 'lovable/**'
      - '.github/workflows/lovable-validacao.yml'
  pull_request:
    paths:
      - 'lovable/**'
      - '.github/workflows/lovable-validacao.yml'

permissions:
  contents: read

jobs:
  validar:
    name: Testes e compilacao React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lovable
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Executar testes
        run: bun run test
      - name: Compilar aplicacao
        run: bun run build
